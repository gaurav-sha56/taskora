[project]
name = "taskora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurav Sharma", email = "sharmagaurav1956@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "dotenv>=0.9.9",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.3.0",
    "llama-cpp-python>=0.3.36",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "transformers>=5.21.0",
]

[project.scripts]
taskora = "taskora:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
